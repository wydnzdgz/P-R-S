[workspace]
members = ["crates/qfall-tools", "crates/plt"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"

[workspace.dependencies]
qfall-tools = { path = "crates/qfall-tools", version = "0.2.0" }
qfall-math = "=0.2.1"
flint3-sys = { version = "=3.6.1", features = ["gmp-mpfr-sys"] }
rand = "=0.10.3"
rand_distr = "=0.6.0"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"
criterion = { version = "0.8", features = ["html_reports"] }

[profile.bench]
debug = true
